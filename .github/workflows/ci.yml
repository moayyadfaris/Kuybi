name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Field initialization (outside entities/DTOs)
        run: npm run typecheck:fields

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kuybi
          POSTGRES_PASSWORD: kuybi
          POSTGRES_DB: kuybi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kuybi" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USERNAME: kuybi
      TEST_DB_PASSWORD: kuybi
      TEST_DB_NAME: kuybi_test
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
      TEST_REDIS_DB: 15
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests with coverage
        run: npm run test:unit:cov

      - name: Integration tests with coverage
        run: npm run test:integration:cov -- --forceExit

      # Combined unit + integration coverage must not drop below the floor
      - name: Coverage gate
        run: npm run coverage:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kuybi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
